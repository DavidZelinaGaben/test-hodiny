name: Pridat hodiny z issue

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  pridat-hodiny:
    if: contains(github.event.issue.body, 'AUTO_HODINY_ZAZNAM')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Overit pravo zapisu
        id: opravneni
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.payload.issue.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });
            const allowed = ["admin", "maintain", "write"].includes(data.permission);
            core.setOutput("allowed", allowed ? "true" : "false");

            if (!allowed) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.payload.issue.number,
                body: "Tenhle uzivatel nema pravo zapisovat do repozitare, zaznam se do CSV nepridal.",
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: context.payload.issue.number,
                state: "closed",
              });
            }

      - name: Setup Python
        if: steps.opravneni.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pridat radek do CSV
        if: steps.opravneni.outputs.allowed == 'true'
        run: python scripts/pridat_hodiny_z_issue.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Commitnout zmenu
        if: steps.opravneni.outputs.allowed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hodiny.csv
          git diff --cached --quiet || git commit -m "Add hours record from issue #${{ github.event.issue.number }}"
          git push

      - name: Zavrit issue
        if: steps.opravneni.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.payload.issue.number,
              body: "Hotovo, zaznam byl pridan do hodiny.csv.",
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: context.payload.issue.number,
              state: "closed",
            });
