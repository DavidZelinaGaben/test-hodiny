<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CEBES - hodiny</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --ink: #1c2430;
        --muted: #5d6878;
        --line: #d9dee7;
        --accent: #2457a6;
        --ok: #147a4d;
        --warn: #b44900;
        --soft-ok: #e6f4ed;
        --soft-warn: #fff0e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.45;
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 17px;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .toolbar,
      .panel-tools,
      .github-settings {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .toolbar {
        align-items: center;
      }

      .panel-tools {
        align-items: center;
      }

      .github-settings {
        padding: 16px;
      }

      button,
      input,
      select {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }

      button {
        cursor: pointer;
        padding: 0 14px;
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      button.secondary {
        background: var(--panel);
        border-color: var(--line);
        color: var(--ink);
      }

      button.icon-button {
        width: 42px;
        min-width: 42px;
        padding: 0;
        font-size: 21px;
        line-height: 1;
      }

      button.danger {
        background: #a62929;
        border-color: #a62929;
      }

      input,
      select {
        width: 100%;
        padding: 0 10px;
        background: #fff;
        color: var(--ink);
      }

      .github-settings input {
        flex: 1 1 360px;
      }

      .message {
        margin: 0 0 18px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .metric,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .metric {
        padding: 16px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 24px;
      }

      .status-ok {
        background: var(--soft-ok);
        border-color: #b8dfca;
      }

      .status-warn {
        background: var(--soft-warn);
        border-color: #f1c499;
      }

      .panel {
        margin-top: 18px;
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .save-status {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .settings-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 16px 16px;
      }

      form {
        display: grid;
        grid-template-columns: 150px 150px 170px 1fr 120px auto;
        gap: 10px;
        padding: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        background: #fafbfc;
        font-size: 13px;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      td input,
      td select {
        min-height: 34px;
      }

      .number {
        text-align: right;
        white-space: nowrap;
      }

      .badge {
        display: inline-flex;
        min-width: 82px;
        justify-content: center;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .ok {
        color: var(--ok);
        background: var(--soft-ok);
      }

      .warn {
        color: var(--warn);
        background: var(--soft-warn);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 900px) {
        header {
          display: block;
        }

        .toolbar {
          margin-top: 14px;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        form {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 620px) {
        main {
          width: min(100% - 20px, 1180px);
          padding-top: 18px;
        }

        .summary,
        form {
          grid-template-columns: 1fr;
        }

        th,
        td {
          padding: 8px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>CEBES - hodiny</h1>
          <p class="subtitle">Pridej radek primo na strance, soucet se prepocita hned a ulozi do GitHubu.</p>
        </div>
        <div class="toolbar">
          <button id="settingsButton" class="icon-button secondary" type="button" aria-label="Nastaveni" title="Nastaveni">⚙</button>
        </div>
      </header>

      <p id="message" class="message">Nacitam hodiny...</p>

      <section id="settingsPanel" class="panel hidden">
        <div class="panel-head">
          <h2>Nastaveni</h2>
          <span id="saveStatus" class="save-status">Token neni nastaveny</span>
        </div>
        <div class="github-settings">
          <input id="tokenInput" type="password" autocomplete="off" placeholder="GitHub token s opravnenim Contents: Read and write">
          <button id="saveTokenButton" type="button">Ulozit token</button>
          <button id="clearTokenButton" class="secondary" type="button">Zapomenout token</button>
        </div>
        <div class="settings-actions">
          <button id="downloadButton" class="secondary" type="button">Stahnout CSV</button>
          <button id="resetButton" class="secondary" type="button">Nacist z GitHubu</button>
        </div>
      </section>

      <section id="summary" class="summary hidden" aria-label="Souhrn vybraneho mesice">
        <div class="metric">
          <span>Predplaceno</span>
          <strong id="limitValue">20 h</strong>
        </div>
        <div class="metric">
          <span>Vycerpano</span>
          <strong id="usedValue">0 h</strong>
        </div>
        <div class="metric">
          <span>Zbyva / prekroceno</span>
          <strong id="balanceValue">0 h</strong>
        </div>
        <div id="statusMetric" class="metric">
          <span>Stav</span>
          <strong id="statusValue">OK</strong>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Pridat hodiny</h2>
        </div>
        <form id="addForm">
          <input id="datumInput" type="date" required aria-label="Datum">
          <input id="zakaznikInput" value="CEBES" required aria-label="Zakaznik">
          <select id="typInput" aria-label="Typ">
            <option value="SW">SW</option>
            <option value="konzultace">konzultace</option>
            <option value="jine">jine</option>
          </select>
          <input id="popisInput" placeholder="Popis prace" required aria-label="Popis prace">
          <input id="hodinyInput" type="number" min="0.25" step="0.25" required aria-label="Hodiny">
          <button type="submit">Pridat</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Mesice</h2>
          <div class="panel-tools">
            <select id="monthSelect" aria-label="Mesic"></select>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Mesic</th>
              <th class="number">Vycerpano</th>
              <th class="number">Zbyva</th>
              <th>Stav</th>
            </tr>
          </thead>
          <tbody id="monthsBody"></tbody>
        </table>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Zaznamy</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Zakaznik</th>
              <th>Popis</th>
              <th>Typ</th>
              <th class="number">Hodiny</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </section>
    </main>

    <script>
      const LIMIT_HODIN = 20;
      const CSV_URL = "hodiny.csv";
      const STORAGE_KEY = "test-hodiny-records-v1";
      const TOKEN_KEY = "test-hodiny-github-token";
      const REPO_OWNER = "DavidZelinaGaben";
      const REPO_NAME = "test-hodiny";
      const REPO_BRANCH = "main";
      const CSV_PATH = "hodiny.csv";
      const GITHUB_CONTENTS_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${CSV_PATH}`;

      const monthSelect = document.getElementById("monthSelect");
      const settingsButton = document.getElementById("settingsButton");
      const settingsPanel = document.getElementById("settingsPanel");
      const downloadButton = document.getElementById("downloadButton");
      const resetButton = document.getElementById("resetButton");
      const message = document.getElementById("message");
      const tokenInput = document.getElementById("tokenInput");
      const saveTokenButton = document.getElementById("saveTokenButton");
      const clearTokenButton = document.getElementById("clearTokenButton");
      const saveStatus = document.getElementById("saveStatus");
      const summary = document.getElementById("summary");
      const monthsBody = document.getElementById("monthsBody");
      const recordsBody = document.getElementById("recordsBody");
      const addForm = document.getElementById("addForm");
      const datumInput = document.getElementById("datumInput");
      const zakaznikInput = document.getElementById("zakaznikInput");
      const typInput = document.getElementById("typInput");
      const popisInput = document.getElementById("popisInput");
      const hodinyInput = document.getElementById("hodinyInput");
      const limitValue = document.getElementById("limitValue");
      const usedValue = document.getElementById("usedValue");
      const balanceValue = document.getElementById("balanceValue");
      const statusMetric = document.getElementById("statusMetric");
      const statusValue = document.getElementById("statusValue");

      let records = [];
      let totals = new Map();
      let saveQueue = Promise.resolve();

      datumInput.value = new Date().toISOString().slice(0, 10);

      function splitCsvLine(line) {
        const values = [];
        let value = "";
        let quoted = false;

        for (let index = 0; index < line.length; index += 1) {
          const char = line[index];
          const next = line[index + 1];

          if (char === '"' && quoted && next === '"') {
            value += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            values.push(value);
            value = "";
          } else {
            value += char;
          }
        }

        values.push(value);
        return values;
      }

      function parseCsv(text) {
        const rows = text.trim().split(/\r?\n/).filter(Boolean);
        const header = splitCsvLine(rows.shift() || "");

        return rows.map((row) => {
          const values = splitCsvLine(row);
          const item = Object.fromEntries(header.map((key, index) => [key, values[index] || ""]));
          return normalizeRecord(item);
        });
      }

      function normalizeRecord(item) {
        return {
          datum: String(item.datum || "").trim(),
          zakaznik: String(item.zakaznik || "CEBES").trim(),
          popis: String(item.popis || "").trim(),
          typ: String(item.typ || "jine").trim(),
          hodiny: Number(String(item.hodiny || "0").replace(",", ".")),
        };
      }

      function escapeCsv(value) {
        const text = String(value ?? "");

        if (/[",\n\r]/.test(text)) {
          return `"${text.replace(/"/g, '""')}"`;
        }

        return text;
      }

      function recordsToCsv() {
        const header = ["datum", "zakaznik", "popis", "typ", "hodiny"];
        const rows = records.map((record) =>
          header.map((key) => escapeCsv(record[key])).join(",")
        );
        return `${header.join(",")}\n${rows.join("\n")}\n`;
      }

      function saveLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function loadLocal() {
        const stored = localStorage.getItem(STORAGE_KEY);

        if (!stored) {
          return null;
        }

        return JSON.parse(stored).map(normalizeRecord);
      }

      function getToken() {
        return localStorage.getItem(TOKEN_KEY) || "";
      }

      function setSaveStatus(text) {
        saveStatus.textContent = text;
      }

      function updateTokenUi() {
        tokenInput.value = "";
        setSaveStatus(getToken() ? "Token ulozeny, zmeny se commituji do GitHubu" : "Token neni nastaveny");
      }

      function toBase64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";

        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }

        return btoa(binary);
      }

      async function githubRequest(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${getToken()}`,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.headers || {}),
          },
        });

        if (!response.ok) {
          const text = await response.text();
          const error = new Error(`GitHub chyba ${response.status}: ${text}`);
          error.status = response.status;
          throw error;
        }

        return response.json();
      }

      async function commitToGithub(reason) {
        if (!getToken()) {
          setSaveStatus("Neulozeno do GitHubu - chybi token");
          return;
        }

        setSaveStatus("Ukladam do GitHubu...");
        await putCsvToGithub(reason);

        setSaveStatus(`Ulozeno do GitHubu ${new Date().toLocaleTimeString("cs-CZ")}`);
      }

      async function putCsvToGithub(reason) {
        const content = toBase64(recordsToCsv());

        for (let attempt = 1; attempt <= 2; attempt += 1) {
          const currentFile = await githubRequest(`${GITHUB_CONTENTS_URL}?ref=${REPO_BRANCH}&t=${Date.now()}`);

          try {
            await githubRequest(GITHUB_CONTENTS_URL, {
              method: "PUT",
              body: JSON.stringify({
                branch: REPO_BRANCH,
                message: reason,
                content,
                sha: currentFile.sha,
              }),
            });
            return;
          } catch (error) {
            if (error.status !== 409 || attempt === 2) {
              throw error;
            }

            setSaveStatus("Soubor se mezitim zmenil, zkousim ulozit znovu...");
          }
        }
      }

      function persistChange(reason) {
        saveLocal();
        render();

        if (!getToken()) {
          setSaveStatus("Zmena je jen v prohlizeci - pro GitHub vloz token");
          return;
        }

        saveQueue = saveQueue
          .then(() => commitToGithub(reason))
          .catch((error) => setSaveStatus(error.message));
      }

      function formatHours(value) {
        return `${Number(value.toFixed(2)).toString()} h`;
      }

      function getMonth(record) {
        return record.datum.slice(0, 7);
      }

      function calculateTotals() {
        totals = new Map();

        for (const record of records) {
          const month = getMonth(record);
          totals.set(month, (totals.get(month) || 0) + record.hodiny);
        }

        totals = new Map([...totals.entries()].sort((a, b) => b[0].localeCompare(a[0])));
      }

      function keepSelectedMonth(previousMonth) {
        monthSelect.innerHTML = "";

        for (const month of totals.keys()) {
          const option = document.createElement("option");
          option.value = month;
          option.textContent = month;
          monthSelect.append(option);
        }

        if (previousMonth && totals.has(previousMonth)) {
          monthSelect.value = previousMonth;
        }
      }

      function renderSummary() {
        const selectedMonth = monthSelect.value;
        const used = totals.get(selectedMonth) || 0;
        const balance = LIMIT_HODIN - used;
        const overLimit = balance < 0;

        limitValue.textContent = formatHours(LIMIT_HODIN);
        usedValue.textContent = formatHours(used);
        balanceValue.textContent = overLimit
          ? `Prekroceno ${formatHours(Math.abs(balance))}`
          : formatHours(balance);
        statusValue.textContent = overLimit ? "Poslat nabidku" : "OK";

        statusMetric.classList.toggle("status-ok", !overLimit);
        statusMetric.classList.toggle("status-warn", overLimit);
        summary.classList.remove("hidden");
      }

      function renderMonths() {
        monthsBody.innerHTML = "";

        for (const [month, used] of totals.entries()) {
          const balance = LIMIT_HODIN - used;
          const overLimit = balance < 0;
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${month}</td>
            <td class="number">${formatHours(used)}</td>
            <td class="number">${overLimit ? `-${formatHours(Math.abs(balance))}` : formatHours(balance)}</td>
            <td><span class="badge ${overLimit ? "warn" : "ok"}">${overLimit ? "Nabidka" : "OK"}</span></td>
          `;
          monthsBody.append(row);
        }
      }

      function createEditableCell(record, key, index, type = "text") {
        const cell = document.createElement("td");
        const input = document.createElement("input");
        input.type = type;
        input.value = record[key];

        if (type === "number") {
          input.min = "0.25";
          input.step = "0.25";
        }

        input.addEventListener("change", () => {
          records[index][key] = key === "hodiny" ? Number(input.value) : input.value.trim();
          persistChange("Update hours record");
        });

        cell.append(input);
        return cell;
      }

      function createTypeCell(record, index) {
        const cell = document.createElement("td");
        const select = document.createElement("select");

        for (const value of ["SW", "konzultace", "jine"]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          select.append(option);
        }

        select.value = record.typ;
        select.addEventListener("change", () => {
          records[index].typ = select.value;
          persistChange("Update hours record");
        });

        cell.append(select);
        return cell;
      }

      function renderRecords() {
        const selectedMonth = monthSelect.value;
        recordsBody.innerHTML = "";

        records
          .map((record, index) => ({ record, index }))
          .filter(({ record }) => getMonth(record) === selectedMonth)
          .sort((a, b) => b.record.datum.localeCompare(a.record.datum))
          .forEach(({ record, index }) => {
            const row = document.createElement("tr");
            row.append(createEditableCell(record, "datum", index, "date"));
            row.append(createEditableCell(record, "zakaznik", index));
            row.append(createEditableCell(record, "popis", index));
            row.append(createTypeCell(record, index));
            row.append(createEditableCell(record, "hodiny", index, "number"));

            const actionCell = document.createElement("td");
            const deleteButton = document.createElement("button");
            deleteButton.className = "danger";
            deleteButton.type = "button";
            deleteButton.textContent = "Smazat";
            deleteButton.addEventListener("click", () => {
              records.splice(index, 1);
              persistChange("Delete hours record");
            });
            actionCell.append(deleteButton);
            row.append(actionCell);
            recordsBody.append(row);
          });
      }

      function render() {
        const previousMonth = monthSelect.value;
        calculateTotals();

        if (records.length === 0 || totals.size === 0) {
          message.textContent = "Zatim nejsou zadne hodiny.";
          message.classList.remove("hidden");
          summary.classList.add("hidden");
          monthsBody.innerHTML = "";
          recordsBody.innerHTML = "";
          return;
        }

        message.textContent = getToken()
          ? "Zmeny se po pridani, smazani nebo uprave ukladaji committem do GitHubu."
          : "Zmeny se zatim ukladaji jen v tomhle prohlizeci. Pro automaticke ukladani do GitHubu vloz token.";
        message.classList.remove("hidden");
        keepSelectedMonth(previousMonth);
        renderSummary();
        renderMonths();
        renderRecords();
      }

      async function loadFromGithub() {
        const response = await fetch(`${CSV_URL}?t=${Date.now()}`);

        if (!response.ok) {
          throw new Error("Nepodarilo se nacist hodiny.csv.");
        }

        records = parseCsv(await response.text());
      }

      async function start() {
        const localRecords = loadLocal();

        if (localRecords) {
          records = localRecords;
        } else {
          await loadFromGithub();
          saveLocal();
        }

        render();
      }

      saveTokenButton.addEventListener("click", () => {
        const token = tokenInput.value.trim();

        if (!token) {
          setSaveStatus("Token je prazdny");
          return;
        }

        localStorage.setItem(TOKEN_KEY, token);
        updateTokenUi();
        render();
      });

      clearTokenButton.addEventListener("click", () => {
        localStorage.removeItem(TOKEN_KEY);
        updateTokenUi();
        render();
      });

      settingsButton.addEventListener("click", () => {
        settingsPanel.classList.toggle("hidden");
      });

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();
        records.push(normalizeRecord({
          datum: datumInput.value,
          zakaznik: zakaznikInput.value,
          popis: popisInput.value,
          typ: typInput.value,
          hodiny: hodinyInput.value,
        }));
        popisInput.value = "";
        hodinyInput.value = "";
        persistChange("Add hours record");
      });

      monthSelect.addEventListener("change", () => {
        renderSummary();
        renderRecords();
      });

      downloadButton.addEventListener("click", () => {
        const blob = new Blob([recordsToCsv()], { type: "text/csv;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "hodiny.csv";
        link.click();
        URL.revokeObjectURL(link.href);
      });

      resetButton.addEventListener("click", async () => {
        localStorage.removeItem(STORAGE_KEY);
        message.textContent = "Nacitam z GitHubu...";
        message.classList.remove("hidden");
        await loadFromGithub();
        saveLocal();
        render();
      });

      updateTokenUi();
      start().catch((error) => {
        message.textContent = error.message;
        message.classList.remove("hidden");
      });
    </script>
  </body>
</html>
