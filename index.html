<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>test-hodiny</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="main">
    <main>
      <header>
        <div>
          <h1>test-hodiny</h1>
          <p class="subtitle">Evidence hodin CEBES.</p>
        </div>
        <a class="icon-link" href="settings.html" aria-label="Nastaveni" title="Nastaveni">&#9881;</a>
      </header>

      <p id="message" class="message">Nacitam hodiny...</p>

      <section id="summary" class="summary hidden" aria-label="Souhrn vybraneho mesice">
        <div class="metric">
          <span>Predplaceno</span>
          <strong id="limitValue">20 h</strong>
        </div>
        <div class="metric">
          <span>Vycerpano</span>
          <strong id="usedValue">0 h</strong>
        </div>
        <div class="metric">
          <span>Zbyva / prekroceno</span>
          <strong id="balanceValue">0 h</strong>
        </div>
        <div id="statusMetric" class="metric">
          <span>Stav</span>
          <strong id="statusValue">OK</strong>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Pridat hodiny</h2>
        </div>
        <form id="addForm">
          <input id="datumInput" type="date" required aria-label="Datum">
          <input id="zakaznikInput" value="CEBES" required aria-label="Zakaznik">
          <select id="typInput" aria-label="Typ">
            <option value="SW">SW</option>
            <option value="konzultace">konzultace</option>
            <option value="jine">jine</option>
          </select>
          <input id="popisInput" placeholder="Popis prace" required aria-label="Popis prace">
          <input id="hodinyInput" type="number" min="0.25" step="0.25" required aria-label="Hodiny">
          <button type="submit">Pridat</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Mesice</h2>
          <select id="monthSelect" aria-label="Mesic"></select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Mesic</th>
              <th class="number">Vycerpano</th>
              <th class="number">Zbyva</th>
              <th>Stav</th>
            </tr>
          </thead>
          <tbody id="monthsBody"></tbody>
        </table>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Zaznamy</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Zakaznik</th>
              <th>Popis</th>
              <th>Typ</th>
              <th class="number">Hodiny</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
