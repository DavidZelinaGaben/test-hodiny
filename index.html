<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CEBES - sumarizace hodin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --panel: #ffffff;
        --ink: #1c2430;
        --muted: #5d6878;
        --line: #d9dee7;
        --ok: #147a4d;
        --warn: #b44900;
        --soft-ok: #e6f4ed;
        --soft-warn: #fff0e1;
        --accent: #2457a6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.45;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      button,
      select {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }

      button {
        cursor: pointer;
        padding: 0 14px;
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      .button-link {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 14px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      select {
        padding: 0 34px 0 10px;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .metric,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .metric {
        padding: 16px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 24px;
      }

      .metric.status-ok {
        background: var(--soft-ok);
        border-color: #b8dfca;
      }

      .metric.status-warn {
        background: var(--soft-warn);
        border-color: #f1c499;
      }

      .panel {
        overflow: hidden;
      }

      .panel h2 {
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 17px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 11px 16px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        background: #fafbfc;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .number {
        text-align: right;
        white-space: nowrap;
      }

      .badge {
        display: inline-flex;
        min-width: 82px;
        justify-content: center;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .ok {
        color: var(--ok);
        background: var(--soft-ok);
      }

      .warn {
        color: var(--warn);
        background: var(--soft-warn);
      }

      .message {
        margin: 0 0 18px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 20px, 1120px);
          padding-top: 18px;
        }

        header {
          display: block;
        }

        .toolbar {
          margin-top: 16px;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        th,
        td {
          padding: 9px 10px;
          font-size: 14px;
        }
      }

      @media (max-width: 520px) {
        .summary {
          grid-template-columns: 1fr;
        }

        .records th:nth-child(2),
        .records td:nth-child(2),
        .records th:nth-child(4),
        .records td:nth-child(4) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>CEBES - sumarizace hodin</h1>
          <p class="subtitle">Limit 20 hodin mesicne, data ze souboru hodiny.csv</p>
        </div>
        <div class="toolbar">
          <a class="button-link" href="pridat.html">Pridat hodiny</a>
          <select id="monthSelect" aria-label="Mesic"></select>
          <button id="reloadButton" type="button">Obnovit</button>
        </div>
      </header>

      <p id="message" class="message">Nacitam hodiny...</p>

      <section id="summary" class="summary hidden" aria-label="Souhrn vybraneho mesice">
        <div class="metric">
          <span>Predplaceno</span>
          <strong id="limitValue">20 h</strong>
        </div>
        <div class="metric">
          <span>Vycerpano</span>
          <strong id="usedValue">0 h</strong>
        </div>
        <div class="metric">
          <span>Zbyva / prekroceno</span>
          <strong id="balanceValue">0 h</strong>
        </div>
        <div id="statusMetric" class="metric">
          <span>Stav</span>
          <strong id="statusValue">OK</strong>
        </div>
      </section>

      <section class="panel">
        <h2>Mesice</h2>
        <table>
          <thead>
            <tr>
              <th>Mesic</th>
              <th class="number">Vycerpano</th>
              <th class="number">Zbyva</th>
              <th>Stav</th>
            </tr>
          </thead>
          <tbody id="monthsBody"></tbody>
        </table>
      </section>

      <section class="panel" style="margin-top: 18px;">
        <h2>Zaznamy</h2>
        <table class="records">
          <thead>
            <tr>
              <th>Datum</th>
              <th>Zakaznik</th>
              <th>Popis</th>
              <th>Typ</th>
              <th class="number">Hodiny</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </section>
    </main>

    <script>
      const LIMIT_HODIN = 20;
      const CSV_URL = "hodiny.csv";

      const monthSelect = document.getElementById("monthSelect");
      const reloadButton = document.getElementById("reloadButton");
      const message = document.getElementById("message");
      const summary = document.getElementById("summary");
      const monthsBody = document.getElementById("monthsBody");
      const recordsBody = document.getElementById("recordsBody");
      const limitValue = document.getElementById("limitValue");
      const usedValue = document.getElementById("usedValue");
      const balanceValue = document.getElementById("balanceValue");
      const statusMetric = document.getElementById("statusMetric");
      const statusValue = document.getElementById("statusValue");

      let records = [];
      let totals = new Map();

      function parseCsv(text) {
        const rows = text.trim().split(/\r?\n/).filter(Boolean);
        const header = splitCsvLine(rows.shift());

        return rows.map((row) => {
          const values = splitCsvLine(row);
          const item = Object.fromEntries(header.map((key, index) => [key, values[index] || ""]));
          return {
            datum: item.datum.trim(),
            zakaznik: item.zakaznik.trim(),
            popis: item.popis.trim(),
            typ: item.typ.trim(),
            hodiny: Number(item.hodiny.trim().replace(",", ".")),
          };
        });
      }

      function splitCsvLine(line) {
        const values = [];
        let value = "";
        let quoted = false;

        for (let index = 0; index < line.length; index += 1) {
          const char = line[index];
          const next = line[index + 1];

          if (char === '"' && quoted && next === '"') {
            value += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            values.push(value);
            value = "";
          } else {
            value += char;
          }
        }

        values.push(value);
        return values;
      }

      function formatHours(value) {
        return `${Number(value.toFixed(2)).toString()} h`;
      }

      function getMonth(record) {
        return record.datum.slice(0, 7);
      }

      function calculateTotals() {
        totals = new Map();

        for (const record of records) {
          const month = getMonth(record);
          totals.set(month, (totals.get(month) || 0) + record.hodiny);
        }

        totals = new Map([...totals.entries()].sort((a, b) => b[0].localeCompare(a[0])));
      }

      function renderMonthOptions() {
        monthSelect.innerHTML = "";

        for (const month of totals.keys()) {
          const option = document.createElement("option");
          option.value = month;
          option.textContent = month;
          monthSelect.append(option);
        }
      }

      function renderSummary() {
        const selectedMonth = monthSelect.value;
        const used = totals.get(selectedMonth) || 0;
        const balance = LIMIT_HODIN - used;
        const overLimit = balance < 0;

        limitValue.textContent = formatHours(LIMIT_HODIN);
        usedValue.textContent = formatHours(used);
        balanceValue.textContent = overLimit
          ? `Prekroceno ${formatHours(Math.abs(balance))}`
          : formatHours(balance);
        statusValue.textContent = overLimit ? "Poslat nabidku" : "OK";

        statusMetric.classList.toggle("status-ok", !overLimit);
        statusMetric.classList.toggle("status-warn", overLimit);
        summary.classList.remove("hidden");
      }

      function renderMonths() {
        monthsBody.innerHTML = "";

        for (const [month, used] of totals.entries()) {
          const balance = LIMIT_HODIN - used;
          const overLimit = balance < 0;
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${month}</td>
            <td class="number">${formatHours(used)}</td>
            <td class="number">${overLimit ? `-${formatHours(Math.abs(balance))}` : formatHours(balance)}</td>
            <td><span class="badge ${overLimit ? "warn" : "ok"}">${overLimit ? "Nabidka" : "OK"}</span></td>
          `;
          monthsBody.append(row);
        }
      }

      function renderRecords() {
        const selectedMonth = monthSelect.value;
        recordsBody.innerHTML = "";

        records
          .filter((record) => getMonth(record) === selectedMonth)
          .sort((a, b) => b.datum.localeCompare(a.datum))
          .forEach((record) => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${record.datum}</td>
              <td>${record.zakaznik}</td>
              <td>${record.popis}</td>
              <td>${record.typ}</td>
              <td class="number">${formatHours(record.hodiny)}</td>
            `;
            recordsBody.append(row);
          });
      }

      function render() {
        if (records.length === 0) {
          message.textContent = "V hodiny.csv zatim nejsou zadne zaznamy.";
          message.classList.remove("hidden");
          summary.classList.add("hidden");
          return;
        }

        message.classList.add("hidden");
        calculateTotals();
        renderMonthOptions();
        renderSummary();
        renderMonths();
        renderRecords();
      }

      async function loadData() {
        message.textContent = "Nacitam hodiny...";
        message.classList.remove("hidden");

        const response = await fetch(`${CSV_URL}?t=${Date.now()}`);
        if (!response.ok) {
          throw new Error("Nepodarilo se nacist hodiny.csv.");
        }

        records = parseCsv(await response.text());
        render();
      }

      monthSelect.addEventListener("change", () => {
        renderSummary();
        renderRecords();
      });

      reloadButton.addEventListener("click", () => {
        loadData().catch((error) => {
          message.textContent = error.message;
          message.classList.remove("hidden");
        });
      });

      loadData().catch((error) => {
        message.textContent = error.message;
        message.classList.remove("hidden");
      });
    </script>
  </body>
</html>
