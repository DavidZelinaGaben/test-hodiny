<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pridat hodiny - CEBES</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f8;
        --panel: #ffffff;
        --ink: #1c2430;
        --muted: #5d6878;
        --line: #d9dee7;
        --accent: #2457a6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.45;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
      }

      a {
        color: var(--accent);
      }

      .back {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        white-space: nowrap;
      }

      form,
      .message {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      form {
        padding: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      input,
      select {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        color: var(--ink);
        font: inherit;
      }

      .wide {
        grid-column: 1 / -1;
      }

      button {
        min-height: 42px;
        margin-top: 18px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 0 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .message {
        margin-top: 16px;
        padding: 12px 14px;
        color: var(--muted);
      }

      @media (max-width: 620px) {
        main {
          width: min(100% - 20px, 760px);
          padding-top: 18px;
        }

        header {
          display: block;
        }

        .back {
          margin-top: 12px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Pridat hodiny</h1>
          <p class="subtitle">Formular zalozi GitHub issue, Action ho pripise do hodiny.csv.</p>
        </div>
        <a class="back" href="index.html">Zpet na prehled</a>
      </header>

      <form id="hoursForm">
        <div class="grid">
          <label>
            Datum
            <input id="datum" name="datum" type="date" required>
          </label>

          <label>
            Hodiny
            <input id="hodiny" name="hodiny" type="number" min="0.25" step="0.25" placeholder="1" required>
          </label>

          <label>
            Typ
            <select id="typ" name="typ" required>
              <option value="SW">SW</option>
              <option value="konzultace">konzultace</option>
              <option value="jine">jine</option>
            </select>
          </label>

          <label>
            Zakaznik
            <input id="zakaznik" name="zakaznik" value="CEBES" required>
          </label>

          <label class="wide">
            Popis
            <input id="popis" name="popis" placeholder="Telefonicka konzultace" maxlength="160" required>
          </label>
        </div>

        <button type="submit">Ulozit pres GitHub</button>
      </form>

      <p class="message">
        Po kliknuti se otevre GitHub s pripravenym zaznamem. Tam uz jen potvrdis vytvoreni issue.
        GitHub Action pak automaticky pripise radek do CSV a issue zavre.
      </p>
    </main>

    <script>
      const REPO_NEW_ISSUE_URL = "https://github.com/DavidZelinaGaben/test-hodiny/issues/new";
      const form = document.getElementById("hoursForm");
      const datum = document.getElementById("datum");

      datum.value = new Date().toISOString().slice(0, 10);

      function cleanLine(value) {
        return value.trim().replace(/\s+/g, " ");
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const data = new FormData(form);
        const issueBody = [
          "AUTO_HODINY_ZAZNAM",
          `datum: ${cleanLine(data.get("datum"))}`,
          `zakaznik: ${cleanLine(data.get("zakaznik"))}`,
          `popis: ${cleanLine(data.get("popis"))}`,
          `typ: ${cleanLine(data.get("typ"))}`,
          `hodiny: ${cleanLine(data.get("hodiny")).replace(",", ".")}`,
        ].join("\n");

        const params = new URLSearchParams({
          title: `Pridat hodiny: ${cleanLine(data.get("datum"))}`,
          body: issueBody,
        });

        window.location.href = `${REPO_NEW_ISSUE_URL}?${params.toString()}`;
      });
    </script>
  </body>
</html>
