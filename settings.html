<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>test-hodiny - nastaveni</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="settings">
    <main>
      <header>
        <div>
          <h1>Nastaveni</h1>
          <p class="subtitle">Sprava zaznamu a technicke nastaveni.</p>
        </div>
        <button id="backButton" class="secondary" type="button">Zpet</button>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>Sprava zaznamu</h2>
          <select id="monthSelect" aria-label="Mesic"></select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Zakaznik</th>
              <th>Popis</th>
              <th>Typ</th>
              <th class="number">Hodiny</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Cloudflare API</h2>
          <span id="saveStatus" class="save-status">API aktivni</span>
        </div>
        <div class="settings-grid compact-actions">
          <button id="downloadButton" class="secondary" type="button">Stahnout CSV</button>
          <button id="resetButton" class="secondary" type="button">Nacist z GitHubu</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
